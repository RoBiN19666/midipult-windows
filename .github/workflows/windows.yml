name: Windows build

on:
  push:
    branches:
      - main
    tags:
      - "windows-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: .\build.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: .\build-installer.ps1

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Replace("windows-v", "")
          $app = (Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $app) {
            throw "Tag $tag does not match APP_VERSION $app"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MidiPult-windows
          path: |
            dist/update.json
            dist/MidiPult-*-portable.exe
            dist/MidiPult-*-portable.exe.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/update.json
            dist/MidiPult-*-portable.exe
            dist/MidiPult-*-portable.exe.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
